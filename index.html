<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b8dded" />
    <meta name="description" content="Squad Rush — 選擇最佳算術門，壯大隊伍，擊敗每關 Boss。" />
    <title>Squad Rush</title>
  </head>
  <body>
    <main id="app">
      <section class="game-shell" aria-label="Squad Rush 遊戲">
        <canvas id="game-canvas" aria-label="遊戲畫面"></canvas>

        <div id="hud" class="hud is-hidden" aria-live="polite">
          <div class="run-progress" aria-label="關卡進度">
            <span id="progress-fill"></span>
            <i id="progress-runner" aria-hidden="true"></i>
          </div>
          <div id="boss-bar" class="boss-bar is-hidden">
            <span id="boss-fill"></span>
            <strong id="boss-label">BOSS</strong>
          </div>
          <div class="bottom-hud">
            <div class="stage-stat">STAGE <strong id="stage-value">1</strong></div>
            <div class="coin-stat"><i aria-hidden="true"></i><strong id="coin-value">0</strong></div>
            <div id="combo-stat" class="combo-stat is-hidden"><strong id="combo-value">0</strong> COMBO</div>
            <div class="weapon-stat"><span id="weapon-icon" aria-hidden="true">●</span><strong id="weapon-value">BLASTER</strong></div>
          </div>
        </div>

        <div class="floating-actions">
          <button id="pause-button" class="round-button" type="button" aria-label="暫停遊戲">
            <span class="pause-icon" aria-hidden="true"></span>
          </button>
          <button id="sound-button" class="round-button" type="button" aria-label="關閉聲音">
            <span class="sound-icon" aria-hidden="true"></span>
          </button>
        </div>

        <section id="menu-screen" class="screen menu-screen">
          <div class="title-lockup">
            <span class="title-kicker">PICK. GROW. DOMINATE.</span>
            <h1>SQUAD<br /><em>RUSH</em></h1>
            <button id="start-button" class="play-button" type="button">
              <span>PLAY</span>
              <i aria-hidden="true"></i>
            </button>
            <p>拖曳左右移動，選擇更強的門</p>
          </div>
          <div class="save-summary">
            <span>BEST STAGE <strong id="best-stage">1</strong></span>
            <span>COINS <strong id="menu-coins">0</strong></span>
          </div>
        </section>

        <section id="pause-screen" class="screen modal-screen is-hidden">
          <div class="modal-card">
            <span class="modal-kicker">BREAK TIME</span>
            <h2>PAUSED</h2>
            <button id="resume-button" class="play-button small" type="button">CONTINUE</button>
          </div>
        </section>

        <section id="clear-screen" class="screen clear-screen is-hidden" aria-live="assertive">
          <div class="clear-card">
            <span>STAGE <b id="clear-stage">1</b> CLEAR!</span>
            <strong id="clear-coins">+0 COINS</strong>
            <p id="upgrade-message">NEXT STAGE</p>
          </div>
        </section>

        <section id="result-screen" class="screen modal-screen is-hidden">
          <div class="modal-card result-card">
            <span class="modal-kicker">TRY AGAIN</span>
            <h2>SQUAD<br />DOWN</h2>
            <p>今關已變得容易一點，金幣和升級都會保留。</p>
            <dl>
              <div><dt>STAGE</dt><dd id="final-stage">1</dd></div>
              <div><dt>SCORE</dt><dd id="final-score">0000000</dd></div>
              <div><dt>COINS</dt><dd id="final-coins">+0</dd></div>
            </dl>
            <button id="restart-button" class="play-button small" type="button">RETRY STAGE</button>
          </div>
        </section>

        <div id="toast" class="toast" role="status" aria-live="assertive"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
